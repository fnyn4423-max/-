<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10172b">
    <title>SKYBOUND — 横スクロールアクション</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="topbar">
            <a class="brand" href="#" aria-label="SKYBOUND ホーム">
                <span class="brand-mark" aria-hidden="true">✦</span>
                <span>SKYBOUND</span>
            </a>
            <p class="top-note">小さな冒険のはじまり。</p>
        </header>

        <section class="game-card" aria-label="ゲーム">
            <div class="game-heading">
                <div>
                    <p class="eyebrow">SIDE-SCROLLING ADVENTURE</p>
                    <h1>星をあつめて、ゴールへ。</h1>
                </div>
                <button class="restart-button" id="restart-button" type="button">
                    <span aria-hidden="true">↻</span> はじめから
                </button>
            </div>

            <div class="game-frame">
                <canvas id="game" width="960" height="540" aria-label="横スクロールアクションゲーム">
                    このゲームを遊ぶには、Canvasに対応したブラウザーが必要です。
                </canvas>
                <div class="hud" aria-live="polite">
                    <div class="hud-pill"><span class="hud-icon">✦</span><span id="score">0</span><span class="hud-label">/ 8</span></div>
                    <div class="hud-pill hearts" id="hearts" aria-label="残りライフ">♥ ♥ ♥</div>
                    <div class="hud-pill progress-pill"><span id="progress">0</span><span class="hud-label">%</span></div>
                </div>
                <div class="game-message" id="game-message" hidden>
                    <div class="message-card">
                        <span class="message-sparkle" id="message-icon" aria-hidden="true">✦</span>
                        <p class="eyebrow" id="message-eyebrow">ADVENTURE COMPLETE</p>
                        <h2 id="message-title">やったね！</h2>
                        <p id="message-copy">星を集めてゴールに到着！</p>
                        <button class="play-button" id="play-button" type="button">もう一度あそぶ <span aria-hidden="true">→</span></button>
                    </div>
                </div>
            </div>

            <footer class="game-footer">
                <div class="controls-hint">
                    <span class="key-group"><kbd>←</kbd><kbd>→</kbd></span>
                    <span>移動</span>
                    <span class="hint-divider">·</span>
                    <span class="key-group"><kbd>Space</kbd></span>
                    <span>ジャンプ</span>
                </div>
                <p>星を集めながら、ゴールを目指そう <span aria-hidden="true">↗</span></p>
            </footer>
        </section>
        <p class="mobile-hint">スマートフォンでは画面下のボタンで操作できます。</p>
        <div class="touch-controls" aria-label="タッチ操作">
            <button type="button" class="touch-button" data-control="left" aria-label="左へ移動">←</button>
            <button type="button" class="touch-button jump-button" data-control="jump" aria-label="ジャンプ">JUMP</button>
            <button type="button" class="touch-button" data-control="right" aria-label="右へ移動">→</button>
        </div>
    </main>
    <script src="game.js"></script>
</body>
</html>
